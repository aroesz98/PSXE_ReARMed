# Display: LTDC, frame buffers owned by the application (zero-copy flip)
CONFIG_DISPLAY=y
CONFIG_STM32_LTDC_RGB565=y
CONFIG_STM32_LTDC_FB_NUM=0
CONFIG_MEMC=y
CONFIG_GPIO=y

# Ethernet: the HAL driver alone, no network stack (see src/eth_raw.c)
CONFIG_NETWORKING=n
CONFIG_PINCTRL=y

# Floating point: NemaGFX is linked in its hard-float flavour
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_FP_HARDABI=y

# CPU <-> GPU / DMA coherency
CONFIG_CACHE_MANAGEMENT=y
CONFIG_NOCACHE_MEMORY=y

# Memory / threads
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_ISR_STACK_SIZE=4096
CONFIG_MAIN_THREAD_PRIORITY=5

# Speed
CONFIG_SPEED_OPTIMIZATIONS=y

# Diagnostics
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=4096

# Keep the debug port alive while the idle thread sleeps (hot attach, SWD memory dumps)
CONFIG_STM32_ENABLE_DEBUG_SLEEP_STOP=y
